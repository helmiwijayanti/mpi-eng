<h2>🪞 Refleksi: Berhenti sejenak, pikirkan perjalananmu</h2>
<p>Jawabanmu tersimpan otomatis di perangkat ini. Jujur saja — refleksi ini untuk belajarmu, bukan untuk nilai.</p>
<label for="r1">1. Hal baru apa yang kamu pelajari hari ini?</label>
<textarea id="r1" data-save="refleksi1" placeholder="Tulis hal barumu…"></textarea>
<label for="r2">2. Bagian mana yang paling kamu pahami?</label>
<textarea id="r2" data-save="refleksi2" placeholder="Tulis bagian yang paling kamu pahami…"></textarea>
<label for="r3">3. Bagian mana yang masih membuatmu bingung?</label>
<textarea id="r3" data-save="refleksi3" placeholder="Tulis bagian yang masih membingungkan…"></textarea>
<label for="r4">4. Di mana kamu bisa memakai kemampuan ini di kehidupan nyata?</label>
<textarea id="r4" data-save="refleksi4" placeholder="Contoh: saat membantu orang tua memeriksa tagihan…"></textarea>
<button type="button" class="btn btn-primary" id="salinRefleksi">SALIN REFLEKSI</button>
<button type="button" class="btn" onclick="window.print()">CETAK</button>
<div id="salinStatus" class="feedback" style="display:none" aria-live="polite"></div>

<script src="assets/app.js"></script>
<script>
(function () {
  document.getElementById("salinRefleksi").addEventListener("click", function () {
    function v(id) { return document.getElementById(id).value || "-"; }
    var text = "Refleksi — How to Pay using S Pay Later\n1. Hal baru: " + v("r1") + "\n2. Paling paham: " + v("r2") + "\n3. Masih bingung: " + v("r3") + "\n4. Dipakai di: " + v("r4");
    var st = document.getElementById("salinStatus");
    st.style.display = "block";
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { st.textContent = "Refleksi berhasil disalin."; }).catch(function () { st.textContent = "Gagal menyalin otomatis."; });
    } else { st.textContent = "Peramban ini tidak mendukung salin otomatis."; }
  });
})();
</script>
